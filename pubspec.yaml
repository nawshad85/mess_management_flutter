name: mess_manager
description: "Mess Manager - A student mess management app"
publish_to: 'none'
version: 1.0.2+3

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.2
  cloud_firestore: ^5.6.6
  firebase_storage: ^12.4.5
  firebase_remote_config: 5.5.0

  # State Management
  get: ^4.7.2

  # Utilities
  intl: ^0.20.2
  crypto: ^3.0.6
  uuid: ^4.5.1
  flutter_local_notifications: ^17.2.4
  onesignal_flutter: ^5.3.0
  http: ^1.3.0
  package_info_plus: ^8.3.1
  in_app_update: ^4.2.5
  ota_update: ^7.1.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/messhub_icon.png"
  adaptive_icon_background: "#0F172A"
  adaptive_icon_foreground: "assets/icon/messhub_icon.png"

flutter:
  # Keep normal `flutter run` commands on the sideload-capable build.
  # Use `--flavor play` for Google Play app bundles.
  default-flavor: direct
  uses-material-design: true
  assets:
    - assets/icon/
