name: Deploy Flutter Web to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-web-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Check deployment secrets
        shell: bash
        run: |
          for name in VERCEL_ORG_ID VERCEL_PROJECT_ID VERCEL_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository secret: $name"
              exit 1
            fi
          done

      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: '3.41.6'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Prepare Web-only notification configuration
        # Native OneSignal calls return immediately on Web. No mobile secrets
        # are needed or uploaded; use the repository's existing example file.
        run: cp lib/utils/secrets.dart.example lib/utils/secrets.dart

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze
        # Existing informational lints stay visible; errors/warnings fail CI.
        run: flutter analyze --no-fatal-infos

      - name: Run existing tests
        run: flutter test test/available_app_update_test.dart

      - name: Build Flutter Web
        run: flutter build web --release

      - name: Install pinned Vercel CLI
        run: npm install --global vercel@65.9.0

      - name: Pull Vercel production settings
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Prepare Vercel Build Output API artifacts
        run: node scripts/prepare-vercel-output.mjs

      - name: Deploy production artifacts
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN" > .vercel/deployment-result.txt
          url=$(node scripts/read-vercel-deployment.mjs .vercel/deployment-result.txt)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          printf '### Production deployment\n\n%s\n' "$url" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify deployed static files and SPA fallback
        run: node scripts/verify-web-deployment.mjs "https://mess-manager-khaki.vercel.app"
